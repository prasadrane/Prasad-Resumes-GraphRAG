<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prasad Resumes GraphRAG — Resume Generator UI</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📄</text></svg>">
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo-area">
                <span class="logo-icon">📄</span>
                <h1>Prasad Resumes <span>GraphRAG</span></h1>
            </div>
            <div class="status-badge" id="system-status">
                <span class="status-dot green"></span> Engine Ready
            </div>
        </header>

        <!-- Main Content Layout -->
        <main class="app-main">
            <!-- Left Side: Generator Form -->
            <section class="panel generator-panel">
                <div class="panel-header">
                    <h2>⚡ Tailor New Resume</h2>
                    <p>Enter the company name and paste the job description to generate an ATS-tailored PDF.</p>
                </div>

                <form id="resume-form" class="resume-form">
                    <div class="form-group">
                        <label for="company-input">Target Company Name <span class="required">*</span></label>
                        <input type="text" id="company-input" placeholder="e.g. Google, Microsoft, GitHub" required autocomplete="off">
                    </div>

                    <div class="form-group">
                        <label for="jd-input">Job Description (JD)</label>
                        <textarea id="jd-input" rows="10" placeholder="Paste full job description requirements, responsibilities, or keywords here..."></textarea>
                    </div>

                    <button type="submit" id="generate-btn" class="btn btn-primary">
                        <span class="btn-text">✨ Generate Tailored Resume</span>
                        <span class="spinner hidden"></span>
                    </button>
                </form>

                <div id="form-alert" class="alert hidden"></div>
            </section>

            <!-- Right Side: History Section -->
            <section class="panel history-panel">
                <div class="panel-header flex-between">
                    <h2>🕒 Tailored History</h2>
                    <button id="refresh-history-btn" class="btn btn-icon" title="Refresh History">🔄</button>
                </div>

                <div class="search-box">
                    <input type="text" id="history-search" placeholder="Search history by company..." autocomplete="off">
                </div>

                <div id="history-list" class="history-list">
                    <div class="loading-placeholder">Loading resume history...</div>
                </div>
            </section>
        </main>

        <!-- Bottom Preview Drawer / Container -->
        <section id="preview-section" class="preview-section hidden">
            <div class="preview-header">
                <div class="preview-title">
                    <span class="preview-icon">👁️</span>
                    <h3 id="preview-filename">Resume Preview</h3>
                </div>
                <div class="preview-actions">
                    <a id="preview-open-link" href="#" target="_blank" class="btn btn-secondary btn-sm">Open in New Tab ↗</a>
                    <button id="close-preview-btn" class="btn btn-icon">✖</button>
                </div>
            </div>
            <div class="preview-body">
                <iframe id="pdf-iframe" src="about:blank" frameborder="0"></iframe>
            </div>
        </section>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
