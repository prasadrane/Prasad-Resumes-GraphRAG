name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  unit-and-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Playwright browser
        run: python -m playwright install chromium --with-deps

      - name: Unit tests with coverage
        run: |
          coverage run -m pytest tests/ -m "not live" --ignore=tests/e2e
          coverage report -m
          coverage xml

      - name: E2E baseline (deterministic, no LLM keys needed)
        run: python scripts/run_e2e_baseline.py

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build web service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: graphrag-web:test
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Build LiteLLM proxy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.litellm
          push: false
          load: true
          tags: graphrag-litellm:test
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Rotate old Docker cache
        run: |
          rm -rf /tmp/.buildx-cache-old
          mv /tmp/.buildx-cache /tmp/.buildx-cache-old
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          rm -rf /tmp/.buildx-cache-old
