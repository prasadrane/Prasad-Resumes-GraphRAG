### GraphRAG 2.5.0 Settings — Prasad Resumes Knowledge Graph
### LLM: Google Gemini (via LiteLLM) | Input: PDFs + Markdown converted to .txt

models:
  default_chat_model:
    type: openai_chat
    auth_type: api_key
    api_key: "dummy-key"  # LiteLLM proxy ignores this, uses configured models
    api_base: http://localhost:8002
    model: freellmapi-chat  # PRIMARY: FreeLLMAPI -> OpenRouter free models (no daily quota)
    encoding_model: cl100k_base
    model_supports_json: true
    concurrent_requests: 3
    concurrency: 3
    async_mode: threaded
    retry_strategy: native
    max_retries: 10
    tokens_per_minute: null
    requests_per_minute: null

  default_embedding_model:
    type: openai_embedding
    auth_type: api_key
    api_key: "dummy-key"  # LiteLLM proxy ignores this
    api_base: http://localhost:8002
    model: llama-nemotron-embed-vl-1b-v2  # Nvidia 2048-dim via FreeLLMAPI -> OpenRouter
    encoding_model: cl100k_base
    concurrent_requests: 3
    concurrency: 3
    async_mode: threaded
    retry_strategy: native
    max_retries: 10
    tokens_per_minute: null
    requests_per_minute: null



### Input settings ###

input:
  storage:
    type: file
    base_dir: "input"
  file_type: text

chunks:
  size: 1000
  overlap: 150
  group_by_columns: [id]

### Output/storage settings ###

output:
  type: file
  base_dir: "output"

cache:
  type: file
  base_dir: "cache"

reporting:
  type: file
  base_dir: "logs"

vector_store:
  default_vector_store:
    type: lancedb
    db_uri: output\lancedb
    container_name: default
    overwrite: True
    # Note: IVF_PQ index requires at least nlist*39 vectors; disabled for small corpora
    # create_index: true
    # index_type: "IVF_PQ"
    # index_params:
    #   nlist: 100
    #   nprobe: 10

### Workflow settings ###

embed_text_units: true
embed_communities: false
embed_relationships: false
embed_entities: false

### Entity extraction ###

entity_extraction:
  entity_types:
    - Person
    - Company
    - Role
    - Technology
    - Skill
    - Competency
    - Project
    - Achievement
    - Story
    - Metric
  max_gleanings: 1

### Summarization ###

summarize_descriptions:
  max_length: 500

### Community reports ###

community_reports:
  max_length: 2000
  max_input_length: 8000

### Claims ###

claim_extraction:
  enabled: false

### Search ###

local_search:
  text_unit_prop: 0.5
  community_prop: 0.1
  conversation_history_max_turns: 3
  top_k_mapped_entities: 10
  top_k_relationships: 10
  max_tokens: 8000

global_search:
  max_tokens: 8000
  data_max_tokens: 8000
  map_max_tokens: 1000
  reduce_max_tokens: 2000
  concurrency: 10
