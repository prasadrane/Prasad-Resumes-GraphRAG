# Tech Patterns for ATS Keyword Extraction
# Each entry is a regex pattern used to match technology names in job descriptions.
patterns:
  - "\\.NET\\s*(?:Core|[6789])?\\b"
  - "\\bC#\\b"
  - "\\bPython\\b"
  - "\\bFastAPI\\b"
  - "\\bAngular\\b"
  - "\\bTypeScript\\b"
  - "\\bAWS\\b"
  - "\\bECS\\b"
  - "\\bFargate\\b"
  - "\\bLambda\\b"
  - "\\bDynamoDB\\b"
  - "\\bBedrock\\b"
  - "\\bClaude\\b"
  - "\\bKafka\\b"
  - "\\bMSK\\b"
  - "\\bSQS\\b"
  - "\\bSNS\\b"
  - "\\bTerraform\\b"
  - "\\bDocker\\b"
  - "\\bKubernetes\\b"
  - "\\bSQL\\s*Server\\b"
  - "\\bOAuth2?\\b"
  - "\\bJWT\\b"
  - "\\bDynatrace\\b"
  - "\\bSplunk\\b"
  - "\\bOpenTelemetry\\b"
  - "\\bMicroservices\\b"
  - "\\bCI/CD\\b"
  - "\\bCrowdStrike\\b"
  - "\\bFalcon\\b"
  - "\\bThreat\\s*Hunting\\b"
  - "\\bObservability\\b"
  - "\\bREST\\s*APIs?\\b"
  - "\\bCQRS\\b"
  - "\\bSingle-Table\\b"
  - "\\bDevEx\\b"
