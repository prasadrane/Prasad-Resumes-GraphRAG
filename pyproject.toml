[project]
name = "prasad-resumes-graphrag"
version = "0.1.0"
description = "GraphRAG knowledge graph engine and ATS resume generator"
requires-python = ">=3.12"
# Keep in sync with requirements.txt — when pyproject.toml exists, Vercel's
# framework detection and dependency install read from this file.
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
    "reportlab>=4.2.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "uvicorn>=0.29.0",
    "aiohttp>=3.11.0",
    "pandas>=2.2.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
]

[tool.vercel]
# Canonical FastAPI app — Vercel's Python framework preset loads this as the
# serverless function handler (replaces the legacy api/index.py + routes setup).
entrypoint = "src.web.app:app"
