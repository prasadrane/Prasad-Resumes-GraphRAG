name: Deploy to Oracle Cloud Always Free

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Unit & Regression Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py"

  deploy-to-oci:
    name: Automated Deploy to Oracle VM
    needs: test-and-verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME || 'ubuntu' }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: ${{ secrets.OCI_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Deploying Prasad-Resumes-GraphRAG to Oracle Cloud VM..."
            
            # Ensure workspace directory exists
            DEPLOY_DIR="${HOME}/Prasad-Resumes-GraphRAG"
            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "Cloning repository..."
              git clone https://github.com/${{ github.repository }}.git "$DEPLOY_DIR"
            fi
            
            cd "$DEPLOY_DIR"
            
            # Pull latest changes
            echo "📥 Pulling latest code..."
            git fetch --all
            git reset --hard origin/master || git reset --hard origin/main
            
            # Restart and rebuild containers
            echo "🐳 Rebuilding & restarting Docker containers..."
            docker compose down --remove-orphans || true
            docker compose up -d --build
            
            # Cleanup unused dangling images
            docker image prune -f
            
            echo "✅ Deployment successful! Health check:"
            sleep 5
            curl -f http://localhost:8000/api/health || echo "⚠️ Health check endpoint pending startup..."
